<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A2O 知識問答</title>
<style>
  :root{
    --bg:#f5f3ef;--ink:#1f2430;--muted:#6b7280;
    --accent:#0f766e;--accent-soft:#d4f0ec;--accent-ink:#ffffff;
    --line:#e4e1da;--card:#ffffff;--user:#e7f5f2;--bot:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.6 "Noto Sans TC","PingFang TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column}
  header{padding:18px 22px 12px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  header h1{font-size:1.1rem;margin:0}
  header .sub{color:var(--muted);font-size:.82rem}
  /* 設定列 */
  .setup{padding:12px 22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
  input[type=password]{flex:1;min-width:260px;padding:.45rem .7rem;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card)}
  input[type=password]:focus{outline:2px solid var(--accent);border-color:transparent}
  button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:.5rem 1.1rem;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .15s}
  button:hover{filter:brightness(1.08)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .key-status{font-size:.82rem;color:var(--muted)}
  .key-status.ok{color:var(--accent);font-weight:700}
  /* 對話區 */
  #chat{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:76%;padding:12px 16px;border-radius:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg .who{font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:4px}
  .msg.bot .who{color:var(--accent)}
  .msg .cite{display:block;margin-top:8px;font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
  .typing{color:var(--muted);font-style:italic}
  /* 輸入列 */
  .inputbar{display:flex;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line)}
  #in{flex:1;padding:.6rem .8rem;border:1px solid var(--line);border-radius:12px;font:inherit;resize:none;max-height:120px;background:var(--card)}
  #in:focus{outline:2px solid var(--accent);border-color:transparent}
  .hint{padding:0 22px 12px;color:var(--muted);font-size:.8rem}
  .chip{display:inline-block;padding:.15rem .7rem;border:1px solid var(--line);border-radius:999px;margin:0 6px 4px 0;cursor:pointer;background:var(--card);font-size:.8rem}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>

<header>
  <div class="logo">A</div>
  <div>
    <h1>A2O 知識問答</h1>
    <div class="sub">由產品母稿・新人須知・報價・退換貨知識庫回答 · 由 Groq 驅動</div>
  </div>
</header>

<div class="setup">
  <input type="password" id="key" placeholder="輸入你的 Groq API key（console.groq.com）">
  <button id="saveKey">儲存並啟用</button>
  <span class="key-status" id="keyStatus">尚未設定 API key</span>
</div>

<div id="chat"></div>

<div class="hint">
  試試：<span class="chip" data-q="WH-12 的輸入電壓範圍是？">WH-12 輸入電壓</span>
  <span class="chip" data-q="WH-12 保固多久？">WH-12 保固</span>
  <span class="chip" data-q="業務報價最多可以給幾折？">報價折扣</span>
  <span class="chip" data-q="客戶問 E-Mark 多久能拿到，怎麼回？">E-Mark</span>
  <span class="chip" data-q="退換貨期限與可以退的情況？">退換貨</span>
</div>

<div class="inputbar">
  <textarea id="in" rows="1" placeholder="問 A2O 的產品或規定…"></textarea>
  <button id="send" disabled>送出</button>
</div>

<script>
const $=s=>document.querySelector(s);
let KEY='';
const GROQ_ENDPOINT='https://api.groq.com/openai/v1/chat/completions';

/* ---------- 知識庫（由 A2O 練習包文件整理） ---------- */
const KB=[
{title:'WH-12 產品母稿（規格）',body:`WH-12 行車記錄器電源線組：免拆線取電，從保險絲盒取電，熄火後可持續供電做停車監控。
輸入：DC 12V/24V 車系通用（9–32V）。輸出：DC 5V 2.5A，附 USB-C 與 Mini USB 兩種接頭。
線長 3.5 公尺，PVC 外被。低電壓保護：11.6V/11.8V/12.0V 三段切換（24V 自動加倍）。
停車監控：熄火後 6/12/24 小時自動斷電。保險絲取電座：迷你、標準、低矮迷你各 1 個。工作溫度 −30～85°C。`},
{title:'WH-12 保固',body:`WH-12 保固：降壓模組 5 年；線材與接頭 3 年；保險絲取電座 1 年。須保留購買證明；人為損壞、未依說明書安裝不在保固內。`},
{title:'WH-12 認證',body:`已取得：RoHS（第三方報告 2026-04）、REACH SVHC 符合聲明、線材彎折壽命 50 萬次（2026-05）、端子與取電座鹽霧測試 96 小時通過（2026-05）。
目前沒有：歐盟 E-Mark（ECE R10）、IATF 16949。客戶問到，回「目前未取得，可以評估」，不可以說多久拿到。`},
{title:'WH-12 適用場景與效益',body:`適用：自用車加裝停車監控、改裝店搭配銷售、計程車/物流車/租賃車隊。
效益：三段低電壓保護（不會用光電瓶）、12V/24V 通用（車隊不用備兩種料）、RoHS/REACH（外銷過得了關）、線材彎折 50 萬次（耐用）。`},
{title:'新人須知 2026：客戶詢問與客訴',body:`一般詢問：1 個工作天內回覆。客訴：4 個工作小時內先回第一封，說明已收到、誰負責、何時再回。所有詢問都要登記案件庫，寫清楚客戶、產品、狀態。
客訴回覆三段式：1 先接住情緒（謝謝告知、抱歉）2 再說明處理（需要什麼、我們會怎麼做）3 最後留窗口（誰負責、什麼時候再回）。`},
{title:'新人須知 2026：報價權限',body:`業務可以給到牌價 95 折。低於 95 折，或單筆超過新台幣 50 萬元，要業務課長核准。海外報價一律經業務課長。`},
{title:'報價流程',body:`步驟：1 確認型號/數量/交貨地點/希望時間 2 查牌價表 3 折扣在權限內→業務直接出單 4 超權限→業務課長核准 5 寄出後案件庫改「已回覆」。
報價單有效期 30 天；交期寫「訂單確認後由業務回覆」，不寫死日期。`},
{title:'退換貨辦法',body:`期限：收貨 14 天內提出申請。
可以退換：未拆封未安裝→可退貨全額退款；產品瑕疵（端子鬆脫、線材破皮）→換新品運費公司負擔；少零件→補寄不用寄回整組。
不能退換：已安裝、非產品瑕疵（買錯規格）；人為損壞、未依說明書安裝。
包裝破損：簽收當場拍照，3 天內通報；超過 3 天由物流課判斷。
誰能答應：第 2 節以內客服可直接答應；以外（免費到府、賠償）要主管核准。`},
{title:'新人須知 2026：對外承諾',body:`交期、認證、保固只能照公司文件講，文件沒寫不要自己答應。免費到府、賠償、折讓、「保證」這類承諾一律要主管核准。產品對外說法以「產品母稿」為準。
本版（2026）取代 2024 版；2024 版已停用（打折下限、客訴回覆時間等不同）。`},
{title:'找誰（窗口）',body:`規格、認證、品質：品保課 王課長。價格、交期、報價核准：業務課 周課長。退換貨、出貨：物流課 江組長。`}
];

/* ---------- 檢索：簡單關鍵字評分 ---------- */
function retrieve(q){
  const words=q.toLowerCase().replace(/[，。？?！!、\s]+/g,' ').trim().split(' ');
  return KB.map((k,i)=>{
    let score=0;
    const hay=(k.title+' '+k.body).toLowerCase();
    for(const w of words){
      if(!w)continue;
      if(hay.includes(w))score+=1;
      // 常用同義/特定詞加分
      if(/保固|warranty/.test(w)&&hay.includes('保固'))score+=2;
      if(/折扣|折/.test(w)&&hay.includes('折'))score+=1;
      if(/客訴|complaint/.test(w)&&hay.includes('客訴'))score+=2;
    }
    return {i,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,3);
}

/* ---------- 呼叫 Groq ---------- */
async function askGroq(question,context){
  const sys=`你是 A2O 公司的客服知識助理。只能根據下面提供的知識庫回答，不要編造。
知識庫沒有的資訊，就說「知識庫沒有這方面資訊，請洽詢相關窗口」。回答簡潔、專業、用繁體中文。
---知識庫---
${context}`;
  const r=await fetch(GROQ_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY},
    body:JSON.stringify({
      model:'llama-3.1-8b-instant',
      messages:[{role:'system',content:sys},{role:'user',content:question}],
      temperature:0.3,max_tokens:500
    })
  });
  if(!r.ok){
    const t=await r.text();
    throw new Error('Groq 錯誤 '+r.status+': '+t.slice(0,200));
  }
  const j=await r.json();
  return j.choices[0].message.content;
}

/* ---------- UI ---------- */
const chat=$('#chat');
function addMsg(role,html){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=`<div class="who">${role==='user'?'你':'A2O 助理'}</div>${html}`;
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}
function addTyping(){
  const d=document.createElement('div');
  d.className='msg bot typing';d.id='typing';d.textContent='思考中…';
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;
}

$('#saveKey').onclick=()=>{
  KEY=$('#key').value.trim();
  if(!KEY){$('#keyStatus').textContent='請輸入 API key';$('#keyStatus').className='key-status';return;}
  $('#keyStatus').textContent='✓ 已啟用';$('#keyStatus').className='key-status ok';
  $('#send').disabled=false;
  addMsg('bot','你好，我是 A2O 知識助理。請問產品規格、保固、認證、報價或退換貨問題。');
};
$('#key').addEventListener('input',e=>{ if(e.target.value.trim())$('#send').disabled=false; });

function send(){
  const q=$('#in').value.trim();
  if(!q||!KEY)return;
  addMsg('user',q.replace(/</g,'&lt;'));
  $('#in').value='';

  const hits=retrieve(q);
  let context;
  if(hits.length===0){
    context='（知識庫中沒有與此問題直接相關的條目）';
  }else{
    context=hits.map(h=>'【'+KB[h.i].title+'】\n'+KB[h.i].body).join('\n\n');
  }
  addTyping();
  askGroq(q,context).then(ans=>{
    const t=$('#typing');if(t)t.remove();
    let html=ans.replace(/</g,'&lt;');
    if(hits.length){
      html+='<span class="cite">參考：'+hits.map(h=>KB[h.i].title).join('、')+'</span>';
    }
    addMsg('bot',html);
  }).catch(err=>{
    const t=$('#typing');if(t)t.remove();
    addMsg('bot','⚠ '+err.message);
  });
}
$('#send').onclick=send;
$('#in').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ $('#in').value=c.dataset.q; send(); });
</script>
</body>
</html>
